<style>
:root{
  --brand:#E8231A; --brand-dk:#C41C14; --brand-active:#F67552;
  --ink:#1E293B; --ink-2:#475569; --ink-3:#7C8DA4; --ink-4:#9AA8BC;
  --bg:#F7F8FA; --card:#FFFFFF; --line:#E2E8F0; --line-2:#EEF2F6;
  --pos:#16A34A; --pos-dk:#059669; --neg:#DC2626; --warn:#D97706;
  --blue:#3B82F6; --blue-dk:#2563EB; --orange:#F59E0B; --gray:#CBD5E1;
  --violet:#7C3AED; --violet-2:#8B5CF6; --teal:#10B981;
  --sb:224px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Malgun Gothic",sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
table{border-collapse:collapse;width:100%}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------------------------------------------------------------- layout */
#app{display:flex;min-height:100vh}
#sb{width:var(--sb);flex:0 0 var(--sb);background:var(--brand);color:#fff;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin}
#sb::-webkit-scrollbar{width:6px}#sb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:3px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
.wrap{padding:18px 22px 28px;display:flex;flex-direction:column;gap:16px;max-width:1560px;width:100%}

/* sidebar */
.sb-top{display:flex;align-items:center;gap:9px;padding:15px 14px 13px}
.sb-logo{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--brand);display:grid;place-items:center;
  font-weight:900;font-size:11px;letter-spacing:-.5px;flex:0 0 34px}
.sb-name{font-size:14px;font-weight:800;line-height:1.15}
.sb-sub{font-size:10px;opacity:.82;margin-top:1px}
.sb-lab{font-size:9.5px;font-weight:700;letter-spacing:.14em;opacity:.62;padding:12px 16px 6px}
.nav{display:flex;flex-direction:column;padding:0 8px;gap:1px}
.nav a,.nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 9px;border-radius:8px;
  font-size:12px;font-weight:600;color:#fff;text-decoration:none;transition:background .12s}
.nav a:hover,.nav button:hover{background:rgba(255,255,255,.14)}
.nav .on{background:var(--brand-active);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.nav .ico{width:15px;text-align:center;font-size:12px;opacity:.92;flex:0 0 15px}
.nav .cv{margin-left:auto;font-size:9px;opacity:.75;transition:transform .15s}
.nav .cv.open{transform:rotate(90deg)}
.sub{display:none;flex-direction:column;gap:1px;padding:2px 0 4px 6px;margin-left:14px;
  border-left:1px solid rgba(255,255,255,.2)}
.sub.open{display:flex}
.sub button{font-size:11.5px;font-weight:500;padding:6px 9px;opacity:.94}
.sub .on{background:rgba(255,255,255,.2);font-weight:700;opacity:1}
.sb-foot{margin-top:auto;padding:12px;font-size:10px}
.sb-foot .box{background:rgba(0,0,0,.17);border-radius:9px;padding:10px 11px}
.sb-foot .k{opacity:.66;font-size:9px;letter-spacing:.1em;font-weight:700}
.sb-foot .v{font-size:13px;font-weight:800;margin:3px 0 5px}
.sb-foot .m{opacity:.72;line-height:1.45;font-size:9.5px}

/* topbar */
#tb{background:#fff;border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:center;
  gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
#tb h1{font-size:15px;font-weight:800;letter-spacing:-.2px}
#tb .sub{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px;padding:0;margin-left:0;border:none}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:7px;
  border:1px solid var(--line);color:var(--ink-2);background:#fff;white-space:nowrap}
.chip.b{border-color:#FBCFCB;color:var(--brand);background:#FFF6F5}
.chip.g{border-color:#BBF7D0;color:var(--pos-dk);background:#F0FDF5}
.chip.mut{color:var(--ink-4)}
.btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:6px 11px;border-radius:7px;
  background:var(--blue-dk);color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(.94)}
.btn.gr{background:#16A34A}
.btn.gh{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
select.sel,input.inp{font:inherit;font-size:11.5px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;
  background:#fff;color:var(--ink)}
input.inp{min-width:190px}

/* card + section */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.card.p{padding:15px 16px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ch .bar{width:3px;height:15px;border-radius:2px;background:var(--brand);flex:0 0 3px}
.ch h2{font-size:13px;font-weight:800;letter-spacing:-.1px}
.ch .n{font-size:10.5px;color:var(--ink-4);font-weight:600}
.ch .r{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink-4);font-weight:600;flex-wrap:wrap}
.grid{display:grid;gap:11px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1120px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}

/* kpi */
.kpi{background:#fff;border:1px solid #D8EFDF;border-radius:12px;padding:13px 14px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.kpi .l{font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--ink-4);text-transform:uppercase}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.8px;margin:7px 0 6px;line-height:1}
.kpi .s{font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.kpi .s2{font-size:9.5px;color:var(--ink-4);margin-top:2px;font-weight:600}
.kpi.sm .v{font-size:20px}

/* table */
.tw{overflow:auto}
.tw.mh{max-height:560px}
tbody tr:hover{background:#FAFCFE}
th,td{padding:8px 11px;text-align:right;white-space:nowrap;font-size:12px}
th:first-child,td:first-child{text-align:left}
thead th{background:#F6F8FA;color:var(--ink-3);font-size:10.5px;font-weight:800;letter-spacing:.02em;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
tbody td{border-top:1px solid var(--line-2);color:var(--ink-2)}
tbody td:first-child{color:var(--ink);font-weight:600}
tr.tot td{background:#F6F8FA;font-weight:800;color:var(--ink);border-top:1.5px solid var(--line)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.mut{color:var(--ink-4)}
.bd{font-weight:800}
.tag{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:99px}
.tag.g{background:#DCFCE7;color:#15803D}.tag.r{background:#FEE7E5;color:#B91C1C}
.tag.y{background:#FEF3C7;color:#92400E}.tag.b{background:#DBEAFE;color:#1D4ED8}

/* chart */
.cbox{position:relative;width:100%}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:9px;font-size:10.5px;
  color:var(--ink-3);font-weight:600}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const SHEET = D.meta.sheetId, TABS = D.meta.tabs;
const MONTHS = D.meta.months, LM = D.meta.latestMonth, LW = D.meta.latestWeek;
const BEP = 864e6;                       // 월 BEP, 원본과 동일
const CH = ['할인점','온라인','오프라인'];
const $ = (s,r)=> (r||document).querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};

/* ------------------------------------------------------------- formatters */
const nf = n => (n==null||isNaN(n)) ? '-' : Math.round(n).toLocaleString('ko-KR');
const mil = n => (n==null||isNaN(n)) ? '-' : (Math.round(n/1e6)).toLocaleString('ko-KR');   // 원 -> 백만
// gt(): 실적·손익 화면용 — 원본과 동일하게 백만/만 단위까지만 축약 (억을 쓰지 않음)
const gt = n => {
  if(n==null||isNaN(n)) return '-';
  const a=Math.abs(n), s=n<0?'-':'';
  if(a>=1e6) return s+Math.round(a/1e6).toLocaleString('ko-KR')+'백만';
  if(a>=1e4) return s+Math.round(a/1e4).toLocaleString('ko-KR')+'만';
  return s+Math.round(a).toLocaleString('ko-KR');
};
// won(): Sell-thru·재고 화면용 — 원본과 동일하게 억/천만까지 축약
const won = n => {
  if(n==null||isNaN(n)) return '-';
  const a=Math.abs(n), s=n<0?'-':'';
  if(a>=1e8) return s+(a/1e8).toFixed(1)+'억';
  if(a>=1e7) return s+(a/1e7).toFixed(1)+'천만';
  if(a>=1e6) return s+Math.round(a/1e6).toLocaleString('ko-KR')+'백만';
  if(a>=1e4) return s+Math.round(a/1e4).toLocaleString('ko-KR')+'만';
  return s+Math.round(a).toLocaleString('ko-KR');
};
const pct = (n,d)=> (n==null||isNaN(n)) ? '-' : n.toFixed(d==null?1:d)+'%';
const sgn = (n,d)=> (n==null||isNaN(n)) ? '-' : (n>=0?'+':'')+n.toFixed(d==null?1:d)+'%';
const cls = n => n==null?'mut':(n>=0?'pos':'neg');
const up = n => n==null?'':(n>=0?'↗':'↘');
const ratio=(a,b)=> (b&&a!=null)? a/b*100 : null;
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 진도율/달성율 색상 규칙 (원본과 동일)
const prog = v => v==null?'mut':v>=80?'pos':v>=50?'warn':'neg';
const achv = v => v==null?'mut':v>=100?'pos':v>=80?'warn':'neg';
const achColor = v => v>=100?'#22C55E':v>=80?'#F59E0B':'#EF4444';

/* --------------------------------------------------------------- charts */
Chart.defaults.font.family='"Pretendard Variable",Pretendard,system-ui,sans-serif';
Chart.defaults.font.size=10.5;
Chart.defaults.color='#7C8DA4';
Chart.defaults.animation.duration=380;
Chart.defaults.plugins.legend.display=false;
Chart.defaults.plugins.tooltip.backgroundColor='rgba(15,23,42,.93)';
Chart.defaults.plugins.tooltip.padding=9;
Chart.defaults.plugins.tooltip.cornerRadius=7;
Chart.defaults.plugins.tooltip.titleFont={weight:'800',size:11.5};
Chart.defaults.plugins.tooltip.bodyFont={weight:'600',size:11};
Chart.defaults.plugins.tooltip.boxWidth=9;
Chart.defaults.plugins.tooltip.boxHeight=9;
Chart.defaults.maintainAspectRatio=false;

/* 막대 끝 값 라벨 — 원본의 LabelList 재현 */
const vlab={id:'vlab',
  afterDatasetsDraw(ch,_a,o){
    if(!o||!o.fmt) return;
    const cx=ch.ctx, horiz=ch.options.indexAxis==='y';
    ch.data.datasets.forEach((ds,di)=>{
      const meta=ch.getDatasetMeta(di); if(meta.type!=='bar'||meta.hidden) return;
      meta.data.forEach((pt,i)=>{
        const v=ds.data[i]; if(v==null) return;
        cx.save();
        cx.font='700 10.5px "Pretendard Variable",Pretendard,system-ui,sans-serif';
        cx.fillStyle=o.color? (typeof o.color==='function'? o.color(v):o.color) : '#475569';
        if(horiz){ cx.textAlign=v>=0?'left':'right'; cx.textBaseline='middle';
          cx.fillText(o.fmt(v), pt.x+(v>=0?6:-6), pt.y); }
        else { cx.textAlign='center'; cx.textBaseline=v>=0?'bottom':'top';
          cx.fillText(o.fmt(v), pt.x, pt.y+(v>=0?-5:5)); }
        cx.restore();
      });
    });
  }};
/* 기준선 (100% / 0) — 원본의 ReferenceLine 재현 */
const rline={id:'rline',
  afterDatasetsDraw(ch,_a,o){
    if(!o||o.value==null) return;
    const horiz=ch.options.indexAxis==='y';
    const sc=horiz? ch.scales.x : ch.scales.y; if(!sc) return;
    const p=sc.getPixelForValue(o.value), a=ch.chartArea, cx=ch.ctx;
    cx.save(); cx.strokeStyle=o.color||'#EF4444'; cx.lineWidth=1.5; cx.setLineDash([4,3]);
    cx.beginPath();

const PENDING=[];
let _flush=0;
/* 카드가 문서에 삽입되기 전에 Chart 를 만들면 캔버스 폭이 확정되지 않아
   막대와 축 라벨이 어긋난다. 생성을 다음 프레임으로 미뤄 레이아웃 확정 후 그린다. */
function chart(parent,h,cfg){
  const box=el('div','cbox'); box.style.height=h+'px';
  const c=el('canvas'); box.appendChild(c); parent.appendChild(box);
  PENDING.push([c,cfg]);
  if(!_flush) _flush=requestAnimationFrame(flushCharts);
  return box;
}
function flushCharts(){
  _flush=0;
  while(PENDING.length){
    const [c,cfg]=PENDING.shift();
    if(!c.isConnected) continue;            // 이미 화면에서 제거된 캔버스는 건너뜀
    try{ CHARTS.push(new Chart(c,cfg)); }catch(e){ console.error(e); }
  }
}
function killCharts(){
  PENDING.length=0;
  if(_flush){ cancelAnimationFrame(_flush); _flush=0; }
  while(CHARTS.length){ try{CHARTS.pop().destroy();}catch(e){} }
}

function gviz(gid){

    const t=setTimeout(()=>{done(); rej(new Error('시트 응답 시간이 초과되었습니다.'));},45000);
    function done(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb]=r=>{ done(); if(r.status!=='ok'){rej(new Error((r.errors&&r.errors[0]&&r.errors[0].detailed_message)||'시트 조회 실패')); return;}
      res((r.table.rows||[]).map(row=>(row.c||[]).map(c=>c==null?null:(c.v==null?null:c.v)))); };
    s.onerror=()=>{ done(); rej(new Error('시트를 불러올 수 없습니다. 시트 공유 설정이 "링크가 있는 모든 사용자"인지 확인해 주세요.')); };

const T=D.target26, A=D.actual26, P=D.actual25;
const g=(o,k,m)=> (o[k]&&o[k][m-1]!=null)? o[k][m-1] : null;
const sum=(o,k,to)=>{let s=0,any=false; for(let m=1;m<=to;m++){const v=g(o,k,m); if(v!=null){s+=v;any=true;}} return any?s:null;};
const wk = m => D.weekly[String(m)]||{};
const wkKeys = m => Object.keys(wk(m)).sort((a,b)=>+a-+b);
const lastWkTotal = m => { const k=wkKeys(m); return k.length? wk(m)[k[k.length-1]].total : null; };
// 주차 보고서는 천원 단위 -> 원
const K = v => v==null?null:v*1000;

/** 특정 월의 채널별 현황 (원본 '채널별 월간 현황' 테이블과 동일 로직) */
function channelRows(m){
  const t=lastWkTotal(m);
  const map={'할인점':'할인점','온라인':'온라인','오프라인':'오프라인'};
  // 당월목표는 원본과 동일하게 '주차 매출보고서'의 당월목표를 우선 사용한다.
  // (주차 보고서가 없는 월은 26년 월별 목표 시트로 대체)
  const out=CH.map(c=>{
    const grp = t? t[c==='할인점'?'할인점':c] : null;
    const target = (grp&&grp['당월목표']!=null)? K(grp['당월목표']) : g(T,map[c],m);
    const prev=g(P,map[c],m);
    const cum = grp? K(grp['누계실적']) : null;
    const close = grp? K(grp['마감']) : null;
    return {name:c,target,cum,close,prev,
      progress:ratio(cum,target), achieve:ratio(close,target),
      growth:(close!=null&&prev)? (close/prev-1)*100 : null};
  });
  const grp = t? t['완구사업부'] : null;
  const target = (grp&&grp['당월목표']!=null)? K(grp['당월목표']) : g(T,'합계',m);
  const prev=g(P,'합계',m);
  const cum = grp? K(grp['누계실적']) : null;
  const close = grp? K(grp['마감']) : null;
  out.push({name:'합계',isTot:true,target,cum,close,prev,
    progress:ratio(cum,target), achieve:ratio(close,target),
    growth:(close!=null&&prev)? (close/prev-1)*100 : null});
  return out;
}
/** 1~m월 누계 기준 채널별 달성율 / 신장율 */
function cumRows(m){
  return [...CH,'합계'].map(c=>{
    let tg=0,cl=0,pv=0;
    for(let i=1;i<=m;i++){
      const t=lastWkTotal(i), grp=t? t[c==='합계'?'완구사업부':c] : null;
      tg += g(T,c,i)||0; pv += g(P,c,i)||0;
      const close = grp? K(grp['마감']) : (c==='합계'? g(A,'합계',i) : g(A,c,i));
      cl += close||0;
    }
    return {name:c, achieve: tg? cl/tg*100 : null, growth: pv? (cl/pv-1)*100 : null};
  });
}
/** 손익 누계 합산 (1Q/2Q/상반기) */
function plAgg(months){
  const ms=months.filter(m=>D.pl[m]); if(!ms.length) return null;
  const base=D.pl[ms[0]], out={variableCosts:{},fixedCosts:{}};
  const flat=['revenue','deduction','netRevenue','cogs','grossProfit','totalVariableCosts',
    'contributionProfit','totalFixedCosts','totalSga','operatingProfit'];
  flat.forEach(k=> out[k]=ms.reduce((s,m)=>s+(D.pl[m][k]||0),0));
  Object.keys(base.variableCosts).forEach(k=> out.variableCosts[k]=ms.reduce((s,m)=>s+(D.pl[m].variableCosts[k]||0),0));
  Object.keys(base.fixedCosts).forEach(k=> out.fixedCosts[k]=ms.reduce((s,m)=>s+(D.pl[m].fixedCosts[k]||0),0));
  const n=out.netRevenue||0, r=(x)=> n? +(x/n*100).toFixed(2):0;
  out.cogsRate=r(out.cogs); out.variableRate=r(out.totalVariableCosts);
  out.contributionRate=r(out.contributionProfit); out.fixedRate=r(out.totalFixedCosts);
  out.sgaRate=r(out.totalSga); out.operatingProfitRate=r(out.operatingProfit);
  return out;
}

/* 채널별 월간 현황 테이블 (실적 대시보드 / 월별 실적 공용) */
function chanTable(rows){
  const cols=[{t:'채널',k:'n'},{t:'당월목표',k:'t'},{t:'누계실적',k:'c'},{t:'당월진도율',k:'p'},
    {t:'마감추정',k:'f'},{t:'달성율',k:'a'},{t:'전년동월',k:'y'},{t:'신장율',k:'g'}];
  const mkr=r=>({n:esc(r.name),t:mil(r.target),c:cell(mil(r.cum),'pos bd'),
    p:cell(pct(r.progress),prog(r.progress)+' bd'),f:mil(r.close),
    a:cell(pct(r.achieve),achv(r.achieve)+' bd'),y:mil(r.prev),
    g:cell(sgn(r.growth),cls(r.growth)+' bd'),_cls:r.isTot?'tot':null});
  return table(cols,rows.filter(r=>!r.isTot).map(mkr),{tot:mkr(rows[rows.length-1])});
}
function achieveChart(cr,suffix){
  const c=card('채널별 목표대비 달성율',{note:suffix});
  const v=cr.map(r=>r.achieve==null?0:+r.achieve.toFixed(1));
  chart(c,190,{type:'bar',data:{labels:cr.map(r=>r.name),
      datasets:[{data:v,backgroundColor:v.map(achColor),borderRadius:3,borderSkipped:false,barPercentage:.6}]},
    options:{indexAxis:'y',layout:{padding:{right:52}},
      scales:{x:{...grid,ticks:{callback:t=>t+'%'},suggestedMax:Math.max(160,Math.ceil(Math.max(...v)/20)*20+20)},y:noGrid},
      plugins:{tooltip:{callbacks:{label:c=>` 달성율: ${pct(c.raw)}`}},
        vlab:{fmt:x=>pct(x),color:'#334155'}, rline:{value:100,label:'100%'}}}});
  legend(c,[{c:'#22C55E',t:'100% 이상'},{c:'#F59E0B',t:'80~100%'},{c:'#EF4444',t:'80% 미만'}]);
  return c;
}
function growthChart(cr,suffix){
  const c=card('채널별 전년대비 신장율',{note:suffix});
  const v=cr.map(r=>r.growth==null?0:+r.growth.toFixed(1));
  chart(c,190,{type:'bar',data:{labels:cr.map(r=>r.name),
      datasets:[{data:v,backgroundColor:v.map(x=>x>=0?'#3B82F6':'#EF4444'),borderRadius:3,borderSkipped:false,barPercentage:.5}]},
    options:{layout:{padding:{top:22}},scales:{x:noGrid,y:axPct},
      plugins:{tooltip:{callbacks:{label:c=>` 전년대비: ${sgn(c.raw)}`}},
        vlab:{fmt:x=>sgn(x),color:x=>x>=0?'#2563EB':'#DC2626'}, rline:{value:0,color:'#94A3B8'}}}});
  legend(c,[{c:'#3B82F6',t:'증가'},{c:'#EF4444',t:'감소'}]);
  return c;
}

  const ml=MONTHS[m-1], confirmed=m<LM;
  const rows=channelRows(m), tot=rows[rows.length-1];

  const hd=el('div');
  hd.innerHTML=`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">

    <span class="tag ${confirmed?'g':'r'}">${confirmed?'확정':'진행중'}</span></div>
    <p style="font-size:10.5px;color:var(--ink-3);margin-top:3px;font-weight:600">2026년 ${ml} 월말 기준 · 단위: 백만원</p>`;
  host.appendChild(hd);

  const yTarget=D.annualTarget, yCum=sum(A,'합계',m);

  g1.appendChild(kpi({sm:1,label:`월간 현매출 (${ml})`,value:gt(tot.cum)+'원',
    sub:`누계 진도율 ${pct(tot.progress)}`,subCls:prog(tot.progress),subIcon:up(tot.progress-100)}));
  g1.appendChild(kpi({sm:1,label:`월마감 ${confirmed?'확정':'추정매출'}`,value:gt(tot.close)+'원',
    sub2:`${ml} 매출보고서 ${confirmed?'마감액':'마감추정액'}`}));
  g1.appendChild(kpi({sm:1,label:'목표대비 마감달성율',value:pct(tot.achieve),
    color:tot.achieve>=100?'#059669':'#DC2626',sub:`전년동월 대비 ${sgn(tot.growth)}`,
    subCls:cls(tot.growth),subIcon:up(tot.growth),sub2:`(25년 ${ml} ${gt(tot.prev)}원)`}));
  g2.appendChild(kpi({sm:1,label:'연간 매출목표 (26년)',value:gt(yTarget)+'원',sub2:'2026년 전체 목표'}));
  g2.appendChild(kpi({sm:1,label:`년간 누계매출 (1월~${ml} 누계)`,value:gt(yCum)+'원',
    sub:`현매출 진도율 ${pct(ratio(yCum,yTarget))}`,subCls:'pos',subIcon:'↗'}));
  g2.appendChild(kpi({sm:1,label:`년누계 월마감추정 (1월~${ml} 누계)`,value:gt(yClose)+'원',
    sub:`연간목표대비 달성율 ${pct(ratio(yClose,yTarget))}`,subCls:'pos',subIcon:'↗'}));
  const pr=ratio(yClose,yTarget);
  g2.appendChild(kpi({sm:1,label:'년목표대비 진도율',value:pct(pr),color:pr>=50?'#059669':'#DC2626',
    sub:`전년대비 ${sgn(yPrev?(yClose/yPrev-1)*100:null)}`,subCls:cls(yPrev?(yClose/yPrev-1)*100:null),
    subIcon:'↗',sub2:`(25년 1~${ml} ${gt(yPrev)}원)`}));
  host.appendChild(g1); host.appendChild(g2);

  const c2=card('채널별 월간 현황',{right:`기준: 2026년 ${ml} 월말 · 단위: 백만원`});
  c2.appendChild(chanTable(rows)); host.appendChild(c2);

  const cr=cumRows(m), gg=el('div','grid g2');
  gg.appendChild(achieveChart(cr,`(1~${ml} 누계기준)`));
  gg.appendChild(growthChart(cr,`(1~${ml} 누계기준)`));
  host.appendChild(gg);

  /* 주차별 실적 상세 */
  const ks=wkKeys(m);
  if(ks.length){
    const c=card('주차별 실적 상세',{note:'주차를 선택하면 해당 시점 누계 실적과 브랜드별 상세를 볼 수 있습니다'});
    const box=el('div','wkgrid');
    const detail=el('div'); detail.style.marginTop='13px';
    ks.forEach(k=>{
      const t=wk(m)[k].total, cum=K(t['완구사업부']['누계실적']), close=K(t['완구사업부']['마감']);
      const p=ratio(cum,tot.target);
      const b=el('button','wk');
      b.innerHTML=`<div class="a">${ml} ${k}주차 ›</div><div class="b tnum">${gt(close)}원</div>
        <div class="c ${prog(p)}">누계 ${gt(cum)}원 (${pct(p)})</div>`;
      b.onclick=()=>{ [...box.children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
        detail.innerHTML=''; detail.appendChild(weekDetail(m,k)); };
      box.appendChild(b);
    });
    c.appendChild(box); c.appendChild(detail); host.appendChild(c);
  }

  /* 월간보고 */
  const rep=D.monthlyReports[ml];
  if(rep){
    const c=el('div','rep');
    const h=el('div','ch'); h.appendChild(el('span','bar'));
    h.appendChild(el('h2',null,esc(`${ml} 월간보고`))); c.appendChild(h);
    c.appendChild(table([{t:'항목',k:'a',w:'158px'},{t:'내용',k:'b'}],
      rep.map(r=>({a:esc(r.label),b:esc(r.content)}))));
    host.appendChild(c);
  }
  host.appendChild(el('div','foot',
    `© 2026 GAIA 완구사업부 · ${ml} 월말 기준 실적 현황 · 25년 월별 매출 / 26년 월별 목표 / 26년 월별 매출 시트 기준`));
}
/* 주차 상세: 브랜드별 + 채널별 */
function weekDetail(m,k){
  const w=wk(m)[k], ml=MONTHS[m-1];
  const c=card(`${ml} ${k}주차 상세`,{right:`기준일: ${esc(w.asOf||'-')} · 단위: 백만원`,accent:'#3B82F6'});
  const tb=el('div','tabs fit');
  const body=el('div');
  const views={
    '브랜드별':()=>{
      const cols=[{t:'브랜드',k:'n'},{t:'전년실적',k:'p'},{t:'당월목표',k:'t'},{t:'누계실적',k:'c'},
        {t:'마감',k:'f'},{t:'진도율',k:'r'}];
      const mk=r=>{const gp=r['완구사업부'];return {n:esc(r.name),p:nf(gp['전년실적']/1000),t:nf(gp['당월목표']/1000),
        c:cell(nf(gp['누계실적']/1000),'pos bd'),f:nf(gp['마감']/1000),
        r:cell(pct(gp['진도율']),prog(gp['진도율'])+' bd')};};
      return table(cols,w.brands.map(mk),{tot:mk(w.total)});
    },
    '채널별':()=>{
      const cols=[{t:'채널',k:'n'},{t:'전년실적',k:'p'},{t:'당월목표',k:'t'},{t:'누계실적',k:'c'},
        {t:'마감',k:'f'},{t:'달성율',k:'r'}];
      const rows=['할인점','온라인','오프라인'].map(ch=>{const gp=w.total[ch];
        return {n:ch,p:nf(gp['전년실적']/1000),t:nf(gp['당월목표']/1000),
          c:cell(nf(gp['누계실적']/1000),'pos bd'),f:nf(gp['마감']/1000),
          r:cell(pct(gp['진도율']),achv(gp['진도율'])+' bd')};});
      const gp=w.total['완구사업부'];
      return table(cols,rows,{tot:{n:'합계',p:nf(gp['전년실적']/1000),t:nf(gp['당월목표']/1000),
        c:cell(nf(gp['누계실적']/1000),'pos bd'),f:nf(gp['마감']/1000),
        r:cell(pct(gp['진도율']),achv(gp['진도율'])+' bd')}});
    }
  };
  let cur='브랜드별';
  const draw=()=>{ body.innerHTML=''; body.appendChild(views[cur]());
    [...tb.children].forEach(b=>b.classList.toggle('on',b.textContent===cur)); };
  Object.keys(views).forEach(k2=>{const b=el('button',null,k2); b.onclick=()=>{cur=k2;draw();}; tb.appendChild(b);});
  c.appendChild(tb); c.appendChild(body); draw();
  /* 주간보고 텍스트 */
  const rep=D.weeklyReports[`${ml} ${k}주차`];
  if(rep){
    const r=el('div','rep'); r.style.marginTop='13px';
    const h=el('div','ch'); h.appendChild(el('span','bar'));
    h.appendChild(el('h2',null,esc(`${ml} ${k}주차 주간보고`))); r.appendChild(h);
    r.appendChild(table([{t:'항목',k:'a',w:'158px'},{t:'내용',k:'b'}],
      rep.map(x=>({a:esc(x.label),b:esc(x.content)}))));
    c.appendChild(r);
  }
  return c;
}

/* ================================================== 3. 손익 분석 (pl-*) */
const PL_LABEL={'1q':'1Q (1~3월 누계)','2q':'2Q (4~6월 누계)','1h':'상반기 (1~6월 누계)'};
const VAR_KEYS=['외주용역비','운반비','소모품비','사업소득판매수수료','광고선전비','판매수수료'];
const FIX_KEYS=['급여','퇴직급여','복리후생비','수도광열비','지급임차료','감가상각비','무형자산상각비',
  '세금과공과','보험료','여비교통비','통신비','차량유지비','교육훈련비','도서인쇄비','지급수수료',
  '접대비','사무용품비','건물관리비'];

function pagePL(host,key){
  const agg={'1q':['1','2','3'],'2q':['4','5','6'],'1h':['1','2','3','4','5','6']}[key];
  const p = agg? plAgg(agg) : D.pl[key];
  const label = PL_LABEL[key] || `${key}월`;
  if(!p){
    host.appendChild(card(null).appendChild
      ? (()=>{const c=card(null); c.innerHTML=`<div class="state">${esc(label)} 손익분석 데이터가 아직 준비되지 않았습니다.<br>
        <span style="font-size:10.5px">구글 시트 "손익분석" 시트에 해당 월 데이터가 추가되면 반영됩니다.</span></div>`;
        return c;})() : null);
    return;
  }
  const hd=el('div');
  hd.innerHTML=`<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
    <h2 style="font-size:15px;font-weight:800">${esc(label)} 손익분석</h2>
    <span class="tag ${p.operatingProfit>=0?'g':'r'}">${p.operatingProfit>=0?'흑자':'적자'}</span></div>
    <p style="font-size:10.5px;color:var(--ink-3);margin-top:3px;font-weight:600">기준: 2026년 ${esc(label)} · 단위: 백만원</p>`;
  host.appendChild(hd);

  /* KPI 5장 */
  const gk=el('div','grid g5');
  gk.appendChild(kpi({sm:1,label:'결산 매출합계',value:mil(p.netRevenue)+'백만',sub:`원가율 ${pct(p.cogsRate)}`,subCls:'mut'}));
  gk.appendChild(kpi({sm:1,label:'매출총이익',value:mil(p.grossProfit)+'백만',color:p.grossProfit<0?'#DC2626':null,
    sub:pct(ratio(p.grossProfit,p.netRevenue)),subCls:p.grossProfit<0?'neg':'pos',sub2:`원가율 ${pct(p.cogsRate)}`}));
  gk.appendChild(kpi({sm:1,label:'공헌이익',value:mil(p.contributionProfit)+'백만',color:p.contributionProfit<0?'#DC2626':null,
    sub:pct(p.contributionRate),subCls:p.contributionProfit<0?'neg':'pos'}));
  gk.appendChild(kpi({sm:1,label:'판관비',value:mil(p.totalSga)+'백만',color:'#DC2626',sub:pct(p.sgaRate),subCls:'neg'}));
  gk.appendChild(kpi({sm:1,label:'영업이익',value:mil(p.operatingProfit)+'백만',color:p.operatingProfit<0?'#DC2626':'#059669',
    sub:pct(p.operatingProfitRate,2),subCls:p.operatingProfit<0?'neg':'pos'}));
  host.appendChild(gk);

  /* 비용 구조 */
  const cs=card('비용 구조 (완구사업팀)',{right:`결산매출 ${mil(p.netRevenue)}백만원 기준`});
  const segs=[{l:'매출원가',v:p.cogs,c:'#374151'},{l:'변동비',v:p.totalVariableCosts,c:'#7C3AED'},
    {l:'고정비',v:p.totalFixedCosts,c:'#8B5CF6'},
    {l:'영업이익',v:Math.abs(p.operatingProfit),c:p.operatingProfit<0?'#EF4444':'#10B981'}];
  // 적자인 달은 매출원가+변동비+고정비가 결산매출을 넘어서므로 결산매출을 100%로 잡으면
  // 마지막 구간이 잘려 보이지 않는다. 구간 합을 기준으로 정규화해 모든 구간이 보이게 한다.
  const segSum=segs.reduce((a,s)=>a+Math.abs(s.v),0)||1;
  const stk=el('div','stk');
  segs.forEach(s=>{const w=Math.abs(s.v)/segSum*100; const d=el('div');
    d.style.cssText=`flex:${Math.abs(s.v)} 1 0;min-width:0;background:${s.c}`;
    if(w>7) d.textContent=mil(s.v)+'백만';
    d.title=`${s.l} ${mil(s.v)}백만 (결산매출의 ${pct(ratio(Math.abs(s.v),p.netRevenue))})`;
    stk.appendChild(d);});
  cs.appendChild(stk);
  legend(cs,segs.map(s=>({c:s.c,t:`${s.l}: ${mil(s.v)}백만`})));
  host.appendChild(cs);

  /* 1~N월 손익 비교 (전 기간 공통) */
  const cc=card('월별 손익 비교',{right:'단위: 백만원'});
  const lbl=plMonths.map(k=>k+'월');
  chart(cc,240,{data:{labels:lbl,datasets:[
      {type:'bar',label:'결산매출',data:plMonths.map(k=>Math.round(D.pl[k].netRevenue/1e6)),backgroundColor:'#94A3B8',borderRadius:3,borderSkipped:false},
      {type:'bar',label:'매출총이익',data:plMonths.map(k=>Math.round(D.pl[k].grossProfit/1e6)),backgroundColor:'#10B981',borderRadius:3,borderSkipped:false},
      {type:'bar',label:'공헌이익',data:plMonths.map(k=>Math.round(D.pl[k].contributionProfit/1e6)),backgroundColor:'#3B82F6',borderRadius:3,borderSkipped:false},
      {type:'bar',label:'영업이익',data:plMonths.map(k=>Math.round(D.pl[k].operatingProfit/1e6)),
       backgroundColor:plMonths.map(k=>D.pl[k].operatingProfit>=0?'#F59E0B':'#EF4444'),borderRadius:3,borderSkipped:false}]},
    options:{scales:{x:noGrid,y:{...grid,ticks:{callback:v=>v+'백만'}}},
      plugins:{tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${nf(c.raw)}백만`}}}}});
  legend(cc,[{c:'#94A3B8',t:'결산매출'},{c:'#10B981',t:'매출총이익'},{c:'#3B82F6',t:'공헌이익'},{c:'#F59E0B',t:'영업이익'}]);
  const cc2=card('월별 영업이익률 · 공헌이익률 추이');
  chart(cc2,200,{data:{labels:lbl,datasets:[
      {type:'line',label:'영업이익률',data:plMonths.map(k=>D.pl[k].operatingProfitRate),borderColor:'#EF4444',
       backgroundColor:'#EF4444',borderWidth:2.5,tension:.3,pointRadius:4,pointBorderColor:'#fff',pointBorderWidth:2},
      {type:'line',label:'공헌이익률',data:plMonths.map(k=>D.pl[k].contributionRate),borderColor:'#3B82F6',
       backgroundColor:'#3B82F6',borderWidth:2.5,tension:.3,pointRadius:4,pointBorderColor:'#fff',pointBorderWidth:2}]},
    options:{scales:{x:noGrid,y:axPct},plugins:{tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${pct(c.raw,2)}`}}}}});
  legend(cc2,[{c:'#EF4444',t:'영업이익률 (%)',line:1},{c:'#3B82F6',t:'공헌이익률 (%)',line:1}]);
  const gp=el('div','grid'); gp.appendChild(cc); gp.appendChild(cc2); host.appendChild(gp);

  /* 손익계산서 상세 */
  const cd=card(`손익계산서 상세 — ${label} · 완구사업팀`,
    {note:'변동비 / 고정비 합계 행을 클릭하면 세부 항목이 펼쳐집니다',
     right:`<button class="btn gh" id="plCsv">CSV</button>`});
  const t=el('table'); t.innerHTML='<thead><tr><th>항목</th><th>완구사업팀</th></tr></thead>';
  const tb=el('tbody'); t.appendChild(tb);
  const R=(label2,val,o={})=>{
    const tr=el('tr');
    const pad=o.sub?'34px':o.indent?'26px':'11px';

function dl2csv(rows,name){

/* =========================================== 4. Sell-thru (지연 로드) */
/** 시트 레이아웃을 헤더에서 동적으로 해석 (이마트/롯데 컬럼 구조가 다름) */
function parseSellthru(grid){
  if(!grid||grid.length<3) throw new Error('시트 형식을 해석할 수 없습니다.');
  const h0=grid[0].map(gstr), h1=grid[1].map(gstr);
  let totalCol=-1; const months=[];
  h0.forEach((v,i)=>{
    const n=v.replace(/\s/g,'');
    if(/^총합계/.test(n)) totalCol=i;
    const m=n.match(/^(\d{1,2})월/); if(m) months.push({m:+m[1],qty:i,amt:i+1,label:m[1]+'월'});
  });
  if(totalCol<0) throw new Error('총 합계 열을 찾을 수 없습니다.');
  const nameCol=h1.findIndex(v=>v==='상품명'), codeCol=h1.findIndex(v=>v==='상품코드');
  // 시트에는 브랜드별 '소계' 행과 맨 아래 '합계' 행이 섞여 있고, 소계 라벨이 상품코드
  // 열에 들어있는 경우도 있다. 앞 3개 열 어디에든 소계/합계가 있으면 집계 행으로 보고
  // 제외한다(중복 합산 방지). 동시에 시트가 스스로 계산한 합계도 따로 모아 대조한다.
  const AGG=/^(소\s*계|합\s*계|총\s*합계|누\s*계)$/;
  const items=[]; let brand='', sheetSub=0, sheetTotal=null;
  for(let r=2;r<grid.length;r++){
    const row=grid[r]; if(!row) continue;
    const c0=gstr(row[0]), c1=gstr(row[codeCol<0?1:codeCol]), c2=gstr(row[nameCol<0?2:nameCol]);
    const amt=gnum(row[totalCol+1]), qty=gnum(row[totalCol]);
    if(AGG.test(c0)||AGG.test(c1)||AGG.test(c2)){
      if(/합\s*계/.test(c0)) sheetTotal=amt||0; else sheetSub+=amt||0;
      continue;
    }
    if(c0) brand=c0;
    if(!c2 && !amt) continue;
    items.push({brand:brand||'기타',code:c1,name:c2,
      qty:qty||0,amount:amt||0,
      byMonth:months.map(mm=>({m:mm.m,label:mm.label,qty:gnum(row[mm.qty])||0,amount:gnum(row[mm.amt])||0}))});
  }
  const monthly=months.map((mm,i)=>({label:mm.label,
    qty:items.reduce((s,it)=>s+it.byMonth[i].qty,0),
    amount:items.reduce((s,it)=>s+it.byMonth[i].amount,0)}));
  const bmap={};
  items.forEach(it=>{ const b=bmap[it.brand]||(bmap[it.brand]={brand:it.brand,qty:0,amount:0,count:0,
      byMonth:months.map(mm=>({label:mm.label,amount:0,qty:0}))});
    b.qty+=it.qty; b.amount+=it.amount; b.count++;
    it.byMonth.forEach((x,i)=>{b.byMonth[i].amount+=x.amount; b.byMonth[i].qty+=x.qty;}); });
  const brands=Object.values(bmap).filter(b=>b.amount>0).sort((a,b)=>b.amount-a.amount);
  return {items,monthly,brands,months:months.map(m=>m.label),
    totalQty:items.reduce((s,i)=>s+i.qty,0), totalAmount:items.reduce((s,i)=>s+i.amount,0),
    sheetTotal, sheetSub};
}
const BRAND_C=['#3B82F6','#8B5CF6','#10B981','#F59E0B','#EF4444','#EC4899','#14B8A6','#F472B6',
  '#A855F7','#FB923C','#6366F1','#06B6D4','#84CC16','#F97316','#0EA5E9','#6B7280'];
const brandColor=(b,i)=>BRAND_C[i%BRAND_C.length];

function pageSellthru(host,which){
  const conf={emart:{name:'이마트',gid:TABS['이마트 sell_thru'],c:'#3B82F6'},

  lazy(host,`${conf.name} Sell-thru`,()=>gviz(conf.gid).then(grid=>{

  const tabs=el('div','tabs'), body=el('div');

      const rows=S.monthly.map((m,i)=>{const pv=i>0?S.monthly[i-1].amount:null;

function pageInventory(host,which){
  const conf={emart:{name:'이마트',gid:TABS['이마트 재고현황']},
              lotte:{name:'롯데마트',gid:TABS['롯데마트 재고현황']}}[which];
  lazy(host,`${conf.name} 재고현황`,()=>gviz(conf.gid).then(grid=>invView(parseInv(grid),conf)));
}
function parseInv(grid){
  const h=grid[0].map(gstr);
  const idx=n=>h.findIndex(v=>v.replace(/\s/g,'')===n);
  let ci={store:idx('점포코드'),code:idx('상품코드'),sname:idx('점포명'),
          pname:idx('상품명'),sales:idx('매출량'),qty:idx('현재수량'),amt:idx('현재금액')};
  if(ci.sname<0||ci.amt<0){ ci={store:0,code:1,sname:2,pname:3,sales:4,qty:5,amt:6}; }
  const items=[];
  for(let r=1;r<grid.length;r++){
    const row=grid[r]; if(!row) continue;
    const sn=gstr(row[ci.sname]), pn=gstr(row[ci.pname]);
    if(!sn&&!pn) continue;
    if(/^(합\s*계|총\s*합계)$/.test(sn)) continue;
    items.push({storeCode:gstr(row[ci.store]),storeName:sn||'-',code:gstr(row[ci.code]),name:pn,
      sales:gnum(row[ci.sales])||0, qty:gnum(row[ci.qty])||0, amount:gnum(row[ci.amt])||0});
  }
  const sm={};
  items.forEach(it=>{const s=sm[it.storeName]||(sm[it.storeName]={name:it.storeName,code:it.storeCode,
    products:0,sales:0,qty:0,amount:0});
    s.products++; s.sales+=it.sales; s.qty+=it.qty; s.amount+=it.amount;});
  const stores=Object.values(sm).sort((a,b)=>b.amount-a.amount);
  const bm={};
  items.forEach(it=>{const b=brandOf(it.name);
    const x=bm[b]||(bm[b]={brand:b,products:0,sales:0,qty:0,amount:0});
    x.products++; x.sales+=it.sales; x.qty+=it.qty; x.amount+=it.amount;});
  const brands=Object.values(bm).sort((a,b)=>b.amount-a.amount);
  return {items,stores,brands,
    totalSales:items.reduce((s,i)=>s+i.sales,0),
    totalQty:items.reduce((s,i)=>s+i.qty,0),
    totalAmount:items.reduce((s,i)=>s+i.amount,0)};
}
const BRAND_KEYS=['마조렛','디키','리틀타익스','마텔','핑크퐁','피카소','다이노월드','펀코','코스비',
  '트레이더스','스카니아','GTOY','짱구','디즈니','에일리언','부가부','키덜트','미미','실바니안'];
function brandOf(name){
  const n=String(name||'');
  for(const k of BRAND_KEYS) if(n.includes(k)) return k;
  return '기타';
}

      const c3=card('브랜드별 매출·재고 상세',{accent:'#10B981'});
      const cols=[{t:'브랜드',k:'n'},{t:'상품수',k:'p'},{t:'매출량',k:'s'},{t:'재고수량',k:'q'},
        {t:'재고금액',k:'a'},{t:'평균단가',k:'u'},{t:'금액 구성비',k:'x'}];
      c3.appendChild(table(cols,V.brands.map((b,i)=>({
        n:`<span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:${brandColor(b.brand,i)};margin-right:6px"></span>${esc(b.brand)}`,
        p:nf(b.products),s:cell(nf(b.sales),'bd'),q:nf(b.qty),a:cell(won(b.amount),'neg bd'),
        u:b.qty?nf(b.amount/b.qty)+'원':'-',x:pct(ratio(b.amount,V.totalAmount))})),
        {tot:{n:'합계',p:nf(V.items.length),s:cell(nf(V.totalSales),'bd'),q:nf(V.totalQty),
          a:cell(won(V.totalAmount),'neg bd'),u:V.totalQty?nf(V.totalAmount/V.totalQty)+'원':'-',x:'100%'}}));
      out.appendChild(c3); return out;
    }
  };
  let cur='점포별 현황';
  const draw=()=>{ killChartsIn(body); body.innerHTML=''; body.appendChild(views[cur]());
    [...tabs.children].forEach(b=>b.classList.toggle('on',b.textContent===cur)); };
  Object.keys(views).forEach(k=>{const b=el('button',null,k); b.onclick=()=>{cur=k;draw();}; tabs.appendChild(b);});
  root.appendChild(tabs); root.appendChild(body); draw();
  return root;
}

/* ====================================================== 네비게이션 / 라우터 */
const monthsAvail=[...new Set([...Object.keys(D.weekly).map(Number),
  ...MONTHS.map((_,i)=>i+1).filter(i=>g(A,'합계',i)!=null)])].sort((a,b)=>a-b);
const plKeys=plMonths.concat(['1q','2q','1h']);
const TITLE={};
const NAV=[
  {k:'kpi',t:'실적 대시보드',i:'▦'},
  {g:'월별 실적',i:'▤',kids:monthsAvail.map(m=>({k:'month-'+m,t:`${m}월 실적`}))},
  {k:'st-emart',t:'이마트 Sell-thru',i:'▚'},
  {k:'st-lotte',t:'롯데마트 Sell-thru',i:'▚'},
  {k:'compare',t:'채널 비교',i:'⑃'},
  {k:'children',t:'5월 유통사별 할인점 매출현황',i:'◫'},
  {k:'inv-emart',t:'이마트 재고현황',i:'▨'},
  {k:'inv-lotte',t:'롯데마트 재고현황',i:'▨'},
  {g:'손익 분석',i:'◭',kids:plKeys.map(k=>({k:'pl-'+k,
    t:{'1q':'1Q 손익','2q':'2Q 손익','1h':'상반기 손익'}[k]||`${k}월 손익`}))},
];
TITLE['kpi']='실적 대시보드';
monthsAvail.forEach(m=>TITLE['month-'+m]=`${m}월 실적 현황`);
TITLE['st-emart']='이마트 Sell-thru 현황'; TITLE['st-lotte']='롯데마트 Sell-thru 현황';
TITLE['compare']='채널 Sell-thru 비교'; TITLE['children']='5월 유통사별 할인점 매출현황';
TITLE['inv-emart']='이마트 재고현황'; TITLE['inv-lotte']='롯데마트 재고현황';
plKeys.forEach(k=>TITLE['pl-'+k]=({'1q':'1Q 손익 분석 (1~3월 누계)','2q':'2Q 손익 분석 (4~6월 누계)',
  '1h':'상반기 손익 분석 (1~6월 누계)'}[k])||`${k}월 손익 분석`);

let CUR='kpi';
function buildNav(){
  const nav=$('#nav'); nav.innerHTML='';
  NAV.forEach(item=>{
    if(item.k){
      const b=el('button',null,`<span class="ico">${item.i}</span><span>${esc(item.t)}</span>`);
      b.dataset.k=item.k; b.onclick=()=>go(item.k); nav.appendChild(b);
    }else{
      const hasCur=item.kids.some(x=>x.k===CUR);
      const b=el('button',null,`<span class="ico">${item.i}</span><span>${esc(item.g)}</span><span class="cv${hasCur?' open':''}">▶</span>`);
      const sub=el('div','sub'+(hasCur?' open':''));
      item.kids.forEach(k=>{const s=el('button',null,esc(k.t)); s.dataset.k=k.k; s.onclick=()=>go(k.k); sub.appendChild(s);});
      b.onclick=()=>{ sub.classList.toggle('open'); $('.cv',b).classList.toggle('open'); };
      nav.appendChild(b); nav.appendChild(sub);
    }
  });
  mark();
}
function mark(){
  document.querySelectorAll('#nav [data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===CUR));
}
function topbar(){
  $('#tbT').textContent=TITLE[CUR]||'대시보드';
  $('#tbS').textContent=`2026년 · 기준: ${MONTHS[LM-1]} ${LW}주차`;
  const lz=/^(st-|compare|inv-)/.test(CUR);
  $('#tbR').innerHTML=`<span class="chip b">📅 ${MONTHS[LM-1]} ${LW}주차</span>
    <span class="chip ${lz?'g':'mut'}">${lz?'구글 시트 실시간 연동':'시트 스냅샷 기준'}</span>
    <button class="btn gh" id="reload">↻ 새로고침</button>
    <button class="btn" id="prt">⤓ PDF / 인쇄</button>
    <span class="chip">완구사업팀</span>`;
  $('#reload').onclick=()=>{ for(const k in _cache) delete _cache[k]; render(); };
  $('#prt').onclick=()=>window.print();
  $('#sbBasis').textContent=`2026년 ${MONTHS[LM-1]}`;
  $('#foot').textContent=`© 2026 GAIA 완구사업부 · 구글 시트 「${D.meta.title}」 기준 · 실적 스냅샷 ${MONTHS[LM-1]} ${LW}주차`;
}
function render(){
  killCharts();
  const host=$('#page'); host.innerHTML='';
  topbar(); mark();
  try{
    if(CUR==='kpi') pageKPI(host);
    else if(CUR.startsWith('month-')) pageMonth(host,+CUR.slice(6));
    else if(CUR.startsWith('pl-')) pagePL(host,CUR.slice(3));
    else if(CUR==='st-emart') pageSellthru(host,'emart');
    else if(CUR==='st-lotte') pageSellthru(host,'lotte');
    else if(CUR==='compare') pageCompare(host);
    else if(CUR==='children') pageChildren(host);
    else if(CUR==='inv-emart') pageInventory(host,'emart');
    else if(CUR==='inv-lotte') pageInventory(host,'lotte');
  }catch(e){
    host.innerHTML=`<div class="card p"><div class="err"><b>화면을 그리는 중 오류가 발생했습니다.</b><br>${esc(e.message)}</div></div>`;
    console.error(e);
  }
  window.scrollTo(0,0);
}
function go(k){ CUR=k; if(location.hash.slice(1)!==k) location.hash=k; else render(); }
window.addEventListener('hashchange',()=>{ const k=location.hash.slice(1); if(k&&k!==CUR){CUR=k;} buildNav(); render(); });
const initial=location.hash.slice(1); if(initial&&TITLE[initial]) CUR=initial;
buildNav(); render();

</script>
</body>
</html>
